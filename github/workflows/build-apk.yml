name: Build APK JobRadar
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "URL HTTPS de production (ex. https://jobradar.mondomaine.fr)"
        required: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - name: Injecter l'URL du site
        run: |
          node -e "const f='capacitor.config.json';const c=require('./'+f);c.server.url='${{ inputs.site_url }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - run: npx cap sync android
      - name: Compiler l'APK (debug)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JobRadar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
